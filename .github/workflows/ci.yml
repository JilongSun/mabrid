name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.11.25"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --directory backend --all-packages --locked
      - run: uv run --directory backend --all-packages --locked python ../scripts/check.py backend

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.11.25"
          python-version: "3.12"
          enable-cache: false
      - run: npm install --global pnpm@11.9.0 --ignore-scripts
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: uv run --no-project --python 3.12 python scripts/check.py frontend

  windows:
    name: Windows Native Scripts
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.11.25"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --directory backend --all-packages --locked
      - run: uv run --directory backend --all-packages --locked python ../scripts/check.py native-windows

  required:
    name: Required Checks
    needs: [backend, frontend, windows]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/check.py gate
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}