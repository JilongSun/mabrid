services:
  mabrid:
    image: ${MABRID_IMAGE:-mabrid:local}
    pull_policy: never
    container_name: ${MABRID_NAME:-mabrid}
    build:
      context: .
      dockerfile: Dockerfile
    labels:
      io.mabrid.config-directory: ${MABRID_CONFIG_DIR}
    ports:
      - 127.0.0.1:${MABRID_PORT:-8765}:8765
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m
    env_file:
      - path: ${MABRID_CONFIG_DIR:?Run setup first}/.env
        format: raw
        required: false
    volumes:
      - data:/var/lib/mabrid
      - type: bind
        source: ${MABRID_CONFIG_DIR}/mabrid.yaml
        target: /var/lib/mabrid/mabrid.yaml
        read_only: true
        bind:
          create_host_path: false
    stop_grace_period: 20s

volumes:
  data:
    name: ${MABRID_NAME:-mabrid}-data
    labels:
      io.mabrid.config-directory: ${MABRID_CONFIG_DIR}