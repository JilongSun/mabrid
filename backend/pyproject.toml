[project]
name = "mabrid-workspace"
version = "0.2.0"
description = "Development workspace for the Mabrid backend."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "jsonschema>=4.23",
  "pyright>=1.1.390",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/bridge",
  "packages/application",
  "apps/server",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["packages", "apps", "../scripts/check.py", "../scripts/release.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
